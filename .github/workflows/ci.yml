name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Run tests
        run: |
          set +e
          python -m pytest -q
          status=$?
          # 5 = no tests collected; treat as success until tests exist
          if [ "$status" -eq 5 ]; then
            echo "No tests collected; passing."
            exit 0
          fi
          exit $status

      - name: Backtest smoke test (offline, synthetic data)
        run: python backtest.py --synthetic 3000 --set min_confirmations=2

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bundle (Android, catches missing imports)
        run: npx expo export --platform android --output-dir /tmp/expo-export
