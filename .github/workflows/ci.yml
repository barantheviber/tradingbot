name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Run tests
        run: |
          set +e
          python -m pytest -q
          status=$?
          # 5 = no tests collected; treat as success until tests exist
          if [ "$status" -eq 5 ]; then
            echo "No tests collected; passing."
            exit 0
          fi
          exit $status
