name: Real-data backtest

# Backtests the strategy on real market history (separate from CI, which only uses synthetic data).
# Data: Binance's public archive (data.binance.vision), reachable from GitHub's US runners.
# Results: the run's summary page, the "backtest-results" artifact, and (for runs on main) the
# `backtest-data` branch (history CSVs + results), which is overwritten on every such run.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Extra settings variants, one per line: name:key=value,key=value"
        required: false
        default: ""
      symbols:
        description: "Pairs (comma separated); empty = the standard set"
        required: false
        default: ""
      timeframes:
        description: "Timeframes (comma separated); empty = the standard set"
        required: false
        default: ""
      data_branch:
        description: "Branch that receives the data and results (use another name for one-off runs)"
        required: false
        default: "backtest-data"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths:
      - "backtest.py"
      - "strategy.py"
      - "risk_manager.py"
      - "config.py"
      - "performance.py"
      - "scripts/download_history.py"
      - "scripts/backtest_matrix.py"
      - "scripts/walk_forward.py"
      - ".github/workflows/real-data-backtest.yml"

permissions:
  contents: write # publishes the backtest-data branch

concurrency:
  group: real-data-backtest-${{ github.ref }}-${{ inputs.data_branch }}
  cancel-in-progress: true

env:
  SYMBOLS: ${{ inputs.symbols || 'BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT' }}
  TIMEFRAMES: ${{ inputs.timeframes || '15m,1h,4h' }}
  DATA_BRANCH: ${{ inputs.data_branch || 'backtest-data' }}
  START: "2021-01"
  SPLIT: "2024-07-01"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24" "ccxt>=4.3" "python-dotenv>=1.0"

      - name: Month key
        id: month
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "set=$(echo "$SYMBOLS $TIMEFRAMES" | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: data/history
          key: history-v1-${{ env.START }}-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/download_history.py') }}-${{ steps.month.outputs.set }}

      - name: Download history
        run: python scripts/download_history.py --symbols "$SYMBOLS" --timeframes "$TIMEFRAMES" --start "$START" --out data/history

      - name: Backtest
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          # the defaults before the 2026-09 retune, kept for comparison (docs/backtest-raporu.md)
          args=(--variant "previous_defaults:atr_sl_multiplier=1.5,risk_reward_ratio=2,trailing_atr_multiplier=2,rsi_long_max=70")
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--variant "$line")
          done <<< "$VARIANTS"
          python scripts/backtest_matrix.py --data data/history --out backtest-results --split "$SPLIT" --yearly "${args[@]}"
          cat backtest-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Walk-forward (4h)
        # rolling 24-month fit / 6-month test windows: do the defaults hold up, and does re-fitting help?
        run: |
          if ls data/history/*-4h.csv* > /dev/null 2>&1; then
            python scripts/walk_forward.py --data data/history --timeframe 4h --out backtest-results/walk-forward
            cat backtest-results/walk-forward/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No 4h history in this run; skipping the walk-forward."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest-results/

      - name: Publish data and results to the backtest-data branch
        # only for main's own runs (weekly / manual), so a PR's results never replace main's
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$DATA_BRANCH" in backtest-data*) ;; *) echo "data_branch must start with backtest-data"; exit 1;; esac
          mkdir -p /tmp/publish && cp -r data/history /tmp/publish/history && cp -r backtest-results /tmp/publish/results
          cd /tmp/publish
          printf 'Generated by the "Real-data backtest" workflow (run %s, commit %s). Overwritten on every run.\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > README.md
          git init -q -b "$DATA_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Backtest data and results (run $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DATA_BRANCH"
